name: PRAMAAN-AI Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pramaan-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: backend
      IS_DEMO_MODE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app backend/tests
      - name: Run backend API, security, regression, and benchmark tests
        run: python -m pytest backend/tests -q

  frontend-syntax:
    name: Frontend ES-module syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check every frontend module
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
            count=$((count + 1))
          done < <(find backend/static/js -type f -name '*.js' -print0)
          test "$count" -gt 0
          echo "Syntax-checked $count JavaScript ES modules."


  browser-demo:
    name: Chromium end-to-end demo
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      IS_DEMO_MODE: "true"
      PRAMAAN_SCREENSHOT_DIR: artifacts
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend and browser-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start the demo server
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --app-dir backend > "$RUNNER_TEMP/pramaan-uvicorn.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "PRAMAAN-AI server is ready."
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health
      - name: Run real-browser demo rehearsal
        run: python -m pytest tests_e2e -q
      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pramaan-ai-evidence-studio-screenshot
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
