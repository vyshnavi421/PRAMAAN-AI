[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pramaan-ai"
version = "1.0.0"
description = "Evidence-First Validation Copilot for AICTE Approvals (SIH26261)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PRAMAAN-AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pypdf>=5.0.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "rapidfuzz>=3.6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
